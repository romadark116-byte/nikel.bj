<!-- ===== TABLEAU DES VENTES - SCROLLABLE HORIZONTALEMENT ===== -->
<div style="overflow-x:auto; overflow-y:visible; border-radius:12px; border:1px solid #f0f0f0; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; padding:0 0 0 0;" id="tableScrollContainer">
    <table style="width:100%; border-collapse:collapse; font-size:0.85rem; min-width:1300px; table-layout:fixed;">
        <thead>
            <tr style="background:#f8f8f8; border-bottom:2px solid #f0f0f0;">
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:40px; min-width:40px; white-space:nowrap; position:sticky; left:0; background:#f8f8f8; z-index:10;">#</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:140px; min-width:140px; white-space:nowrap;">Client</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:200px; min-width:200px; white-space:nowrap;">Email</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:140px; min-width:140px; white-space:nowrap;">Téléphone</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:170px; min-width:170px; white-space:nowrap;">Date</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:120px; min-width:120px; white-space:nowrap;">Total</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:130px; min-width:130px; white-space:nowrap;">Ville</th>
                <th style="text-align:left; padding:10px 8px; font-weight:600; color:#1a1a1a; width:100px; min-width:100px; white-space:nowrap;">Pays</th>
                <th style="text-align:center; padding:10px 8px; font-weight:600; color:#1a1a1a; width:130px; min-width:130px; white-space:nowrap;">Statut</th>
                <th style="text-align:center; padding:10px 8px; font-weight:600; color:#1a1a1a; width:180px; min-width:180px; white-space:nowrap;">Actions</th>
            </tr>
        </thead>
        <tbody id="ventesTableBody">
            <tr>
                <td colspan="10" style="text-align:center; padding:40px; color:#888;">
                    <i class="fas fa-spinner fa-spin" style="font-size:1.5rem; display:block; margin-bottom:12px;"></i>
                    Chargement des données...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- ===== INDICATEUR DE SCROLL ===== -->
<div style="display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.6rem 0 0.3rem; font-size:0.8rem; color:#94a3b8; user-select:none; border-top:1px solid #f0f0f0; margin-top:0;">
    <i class="fas fa-chevron-left" style="opacity:0.5;"></i>
    <span>👆 Faites glisser ou scroll horizontalement pour voir toutes les colonnes</span>
    <i class="fas fa-chevron-right" style="opacity:0.5;"></i>
</div>

<style>
    /* ===== INDICATEUR DE SCROLL ANIMÉ ===== */
    @keyframes pulseScroll {
        0%, 100% { opacity: 0.4; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(6px); }
    }
    
    #tableScrollContainer .fa-chevron-right {
        animation: pulseScroll 1.5s ease-in-out infinite;
    }
    
    /* ===== SURVOL DES LIGNES ===== */
    #ventesTableBody tr:hover {
        background: #fafafa !important;
    }
    
    /* ===== RESPONSIVE MOBILE ===== */
    @media (max-width: 768px) {
        #tableScrollContainer {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            padding: 0 0 4px 0 !important;
        }
        
        #tableScrollContainer table {
            min-width: 900px !important;
            font-size: 0.75rem !important;
        }
        
        #tableScrollContainer table th,
        #tableScrollContainer table td {
            padding: 8px 6px !important;
            font-size: 0.7rem !important;
        }
        
        #tableScrollContainer table th {
            white-space: nowrap !important;
            font-size: 0.7rem !important;
        }
        
        #tableScrollContainer table td .statut-badge {
            font-size: 0.55rem !important;
            padding: 2px 6px !important;
        }
        
        #tableScrollContainer table td button {
            font-size: 0.6rem !important;
            padding: 2px 5px !important;
        }
        
        .scroll-indicator-text {
            font-size: 0.65rem !important;
            padding: 0.4rem 0 0.3rem !important;
        }
    }
    
    @media (max-width: 480px) {
        #tableScrollContainer table {
            min-width: 750px !important;
            font-size: 0.65rem !important;
        }
        
        #tableScrollContainer table th,
        #tableScrollContainer table td {
            padding: 5px 4px !important;
            font-size: 0.6rem !important;
        }
        
        #tableScrollContainer table td .statut-badge {
            font-size: 0.5rem !important;
            padding: 1px 4px !important;
        }
        
        #tableScrollContainer table td button {
            font-size: 0.5rem !important;
            padding: 2px 4px !important;
        }
        
        .scroll-indicator-text {
            font-size: 0.55rem !important;
            padding: 0.3rem 0 0.2rem !important;
        }
    }
</style>

<!-- ===== SCRIPT POUR LA DÉTECTION DU SCROLL ===== -->
<script>
    (function() {
        // Détection du scroll horizontal pour assombrir l'indicateur
        const scrollContainer = document.getElementById('tableScrollContainer');
        if (scrollContainer) {
            scrollContainer.addEventListener('scroll', function() {
                const indicator = document.querySelector('.scroll-indicator-text') || document.querySelector('[style*="Faites glisser"]');
                if (indicator) {
                    const maxScroll = this.scrollWidth - this.clientWidth;
                    if (this.scrollLeft >= maxScroll - 10) {
                        indicator.style.opacity = '0.3';
                    } else {
                        indicator.style.opacity = '1';
                    }
                }
            });
        }
    })();
</script>
