                    <!-- Client -->
                    <div class="vente-client" style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                        <div style="width:40px; height:40px; border-radius:50%; background:#c9a84c; display:flex; align-items:center; justify-content:center; font-weight:700; color:white; font-size:1rem; flex-shrink:0;">
                            ${initiales}
                        </div>
                        <div>
                            <div style="font-weight:600; font-size:1rem; color:#1a1a1a;">${nomComplet}</div>
                            <div style="font-size:0.7rem; color:#888;">${v.ville || 'Ville inconnue'}</div>
                        </div>
                    </div>

                    <!-- Informations -->
                    <div class="vente-info" style="font-size:0.8rem; color:#555; display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-bottom:10px;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <i class="fas fa-envelope" style="width:16px; color:#888;"></i>
                            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${v.email || '—'}">${v.email || '—'}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <i class="fas fa-phone" style="width:16px; color:#888;"></i>
                            ${v.telephone || '—'}
                        </div>
                        <div style="display:flex; align-items:center; gap:6px; grid-column:1/-1;">
                            <i class="fas fa-calendar" style="width:16px; color:#888;"></i>
                            ${formatDate(v.created_at)}
                        </div>
                    </div>

                    <!-- Total -->
                    <div class="vente-total" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-top:8px; border-top:1px solid #f0f0f0;">
                        <span style="color:#888; font-size:0.8rem;">Total</span>
                        <span style="font-weight:700; color:#c9a84c; font-size:1.2rem;">
                            ${v.total_achat ? v.total_achat.toFixed(0).replace('.', ',') + ' FCFA' : '—'}
                        </span>
                    </div>

                    <!-- Statut -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        ${getStatutBadge(v.statut)}
                        <span style="font-size:0.65rem; color:#888;">${v.pays || ''}</span>
                    </div>

                    <!-- Actions -->
                    <div style="display:flex; gap:6px; justify-content:center; border-top:1px solid #f0f0f0; padding-top:10px;">
                        <button onclick="updateStatut(${v.id}, 'soldé')" class="action-btn" style="padding:4px 10px; border:none; border-radius:6px; background:#27ae60; color:white; cursor:pointer; font-size:0.7rem; transition:all 0.3s; display:flex; align-items:center; gap:4px;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fas fa-check"></i> Soldé
                        </button>
                        <button onclick="updateStatut(${v.id}, 'en attente')" class="action-btn" style="padding:4px 10px; border:none; border-radius:6px; background:#f39c12; color:white; cursor:pointer; font-size:0.7rem; transition:all 0.3s; display:flex; align-items:center; gap:4px;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fas fa-clock"></i> Attente
                        </button>
                        <button onclick="updateStatut(${v.id}, 'annulé')" class="action-btn" style="padding:4px 10px; border:none; border-radius:6px; background:#e74c3c; color:white; cursor:pointer; font-size:0.7rem; transition:all 0.3s; display:flex; align-items:center; gap:4px;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fas fa-times"></i> Annulé
                        </button>
                    </div>
                </div>
            `}).join('');

            updateVentesPaginationInfo();
        }

        // ==========================================
        // STATISTIQUES
        // ==========================================
        function updateVentesStats() {
            const total = allVentes.length;
            const sold = allVentes.filter(v => v.statut === 'soldé').length;
            const attente = allVentes.filter(v => v.statut === 'en attente').length;
            const annul = allVentes.filter(v => v.statut === 'annulé').length;
            
            document.getElementById('totalCommandes').textContent = total;
            document.getElementById('totalSoldees').textContent = sold;
            document.getElementById('totalEnAttente').textContent = attente;
            document.getElementById('totalAnnulees').textContent = annul;
        }

        // ==========================================
        // PAGINATION
        // ==========================================
        function updateVentesPaginationInfo() {
            const total = filteredVentes.length;
            const start = (currentPage - 1) * perPage + 1;
            const end = Math.min(currentPage * perPage, total);
            const totalPages = Math.ceil(total / perPage) || 1;

            const infoEl = document.getElementById('ventesPaginationInfo');
            const pageEl = document.getElementById('ventesPageInfo');
            const prevBtn = document.getElementById('prevVentesPage');
            const nextBtn = document.getElementById('nextVentesPage');
            
            if (infoEl) {
                infoEl.textContent = `Affichage de ${total > 0 ? start : 0} à ${end} sur ${total} entrées`;
            }
            if (pageEl) {
                pageEl.textContent = `Page ${currentPage} sur ${totalPages}`;
            }
            if (prevBtn) {
                prevBtn.disabled = currentPage <= 1;
            }
            if (nextBtn) {
                nextBtn.disabled = currentPage >= totalPages;
            }
        }

        function prevVentesPage() {
            if (currentPage > 1) {
                currentPage--;
                renderVentes();
            }
        }

        function nextVentesPage() {
            const totalPages = Math.ceil(filteredVentes.length / perPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderVentes();
            }
        }

        // ==========================================
        // FILTRES
        // ==========================================
        function applyVentesFilters() {
            const search = document.getElementById('searchVentes').value.toLowerCase().trim();
            const statut = document.getElementById('filterStatut').value;
            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;

            filteredVentes = allVentes.filter(v => {
                let match = true;
                
                if (search) {
                    const fullName = `${v.prenom || ''} ${v.nom || ''}`.toLowerCase();
                    const email = (v.email || '').toLowerCase();
                    const phone = (v.telephone || '').toLowerCase();
                    match = fullName.includes(search) || email.includes(search) || phone.includes(search);
                }
                
                if (statut !== 'all') {
                    match = match && v.statut === statut;
                }
                
                if (dateDebut && match) {
                    const d1 = new Date(dateDebut);
                    const dV = new Date(v.created_at);
                    if (d1 > dV) match = false;
                }
                if (dateFin && match) {
                    const d2 = new Date(dateFin);
                    const dV = new Date(v.created_at);
                    d2.setHours(23, 59, 59);
                    if (d2 < dV) match = false;
                }
                
                return match;
            });

            currentPage = 1;
            renderVentes();
        }

        function resetVentesFilters() {
            document.getElementById('searchVentes').value = '';
            document.getElementById('filterStatut').value = 'all';
            document.getElementById('dateDebut').value = '';
            document.getElementById('dateFin').value = '';
            filteredVentes = [...allVentes];
            currentPage = 1;
            renderVentes();
        }

        // ==========================================
        // METTRE À JOUR LE STATUT
        // ==========================================
        async function updateStatut(id, newStatut) {
            const v = allVentes.find(item => item.id === id);
            if (!v) return;

            const oldStatut = v.statut;
            v.statut = newStatut;
            
            const f = filteredVentes.find(item => item.id === id);
            if (f) f.statut = newStatut;

            renderVentes();
            updateVentesStats();

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('clients')
                        .update({ statut_produit: newStatut })
                        .eq('id', id);

                    if (error) {
                        console.error('❌ Erreur mise à jour Supabase:', error);
                        v.statut = oldStatut;
                        if (f) f.statut = oldStatut;
                        renderVentes();
                        updateVentesStats();
                        showNotification('❌ Erreur lors de la mise à jour', 'error');
                        return;
                    }
                }
                
                showNotification(`✅ Statut mis à jour : ${newStatut}`, 'success');

            } catch (err) {
                console.error('❌ Erreur:', err);
                showNotification('❌ Erreur lors de la mise à jour', 'error');
            }
        }

        // ==========================================
        // EXPORTER CSV
        // ==========================================
        function exportCSV() {
            if (allVentes.length === 0) {
                showNotification('❌ Aucune donnée à exporter', 'error');
                return;
            }

            let csv = 'ID,Client,Email,Téléphone,Date,Total,Ville,Pays,Statut\n';
            allVentes.forEach(v => {
                const client = `${v.prenom || ''} ${v.nom || ''}`.trim();
                const statutValue = v.statut_produit || v.statut || '';
                csv += `${v.id},"${client}","${v.email || ''}","${v.telephone || ''}","${formatDate(v.created_at)}","${v.total_achat || 0}","${v.ville || ''}","${v.pays || ''}","${statutValue}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ventes_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showNotification('✅ Export CSV effectué avec succès', 'success');
        }

        // ==========================================
        // RAFRAÎCHIR
        // ==========================================
        function rafraichirVentes() {
            loadVentesData();
            showNotification('🔄 Données actualisées', 'info');
        }

        // ==========================================
        // CHARGER LES DONNÉES
        // ==========================================
        async function loadVentesData() {
            try {
                console.log('📝 Chargement des données...');
                
                if (!supabaseClient) {
                    console.warn('⚠️ Supabase non disponible, utilisation des données de test');
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('clients')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('❌ Erreur chargement:', error);
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                    return;
                }

                if (data && data.length > 0) {
                    console.log(`✅ ${data.length} clients chargés`);
                    
                    allVentes = data.map(c => ({
                        ...c,
                        statut: c.statut_produit || 'en attente'
                    }));
                    
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                } else {
                    console.warn('⚠️ Aucune donnée, utilisation des données de test');
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                }

            } catch (err) {
                console.error('❌ Erreur:', err);
                allVentes = getTestData();
                filteredVentes = [...allVentes];
                renderVentes();
                updateVentesStats();
            }
        }

        // ==========================================
        // NOTIFICATION
        // ==========================================
        function showNotification(message, type = 'info') {
            document.querySelectorAll('.toast-nikel').forEach(t => t.remove());

            const colors = {
                success: '#27ae60',
                error: '#e74c3c',
                info: '#c9a84c'
            };

            const toast = document.createElement('div');
            toast.className = 'toast-nikel';
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: #1a1a1a;
                color: white;
                padding: 16px 24px;
                border-radius: 14px;
                font-weight: 500;
                box-shadow: 0 8px 40px rgba(0,0,0,0.25);
                z-index: 9999;
                max-width: 400px;
                font-size: 0.95rem;
                display: flex;
                align-items: center;
                gap: 12px;
                animation: slideUp 0.5s ease;
                border-left: 4px solid ${colors[type] || colors.info};
            `;
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ==========================================
        // EXPOSER LES FONCTIONS
        // ==========================================
        window.applyVentesFilters = applyVentesFilters;
        window.resetVentesFilters = resetVentesFilters;
        window.prevVentesPage = prevVentesPage;
        window.nextVentesPage = nextVentesPage;
        window.updateStatut = updateStatut;
        window.exportCSV = exportCSV;
        window.rafraichirVentes = rafraichirVentes;
        window.showNotification = showNotification;
        window.loadVentesData = loadVentesData;

        // ==========================================
        // INITIALISATION
        // ==========================================
        function init() {
            console.log('🚀 Chargement de suivi-ventes.html (version grille)...');
            
            const grid = document.getElementById('ventesGrid');
            if (!grid) {
                console.error('❌ Grid non trouvé');
                return;
            }
            
            loadVentesData();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
