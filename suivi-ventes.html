<!-- suivi-ventes.html - Version identique au catalogue produits -->
<div id="ventesContainer">

    <!-- ===== TITRE ===== -->
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:24px;">
        <div>
            <h2 style="font-size:2.2rem; font-weight:600; color:#1e293b; display:flex; align-items:center; gap:0.75rem; margin-bottom:0.25rem;">
                <i class="fas fa-chart-line" style="color:#3b82f6;"></i> Suivi des ventes
            </h2>
            <div style="color:#475569; margin-bottom:2rem; border-left:4px solid #3b82f6; padding-left:1rem; font-weight:400; display:flex; justify-content:space-between; flex-wrap:wrap; align-items:center;">
                <span><i class="fas fa-database"></i> connecté à Supabase · <span id="totalCommandes">0</span> commandes</span>
                <span style="background:#1e293b; color:#94a3b8; padding:0.3rem 0.9rem; border-radius:40px; font-size:0.8rem; font-weight:500; letter-spacing:0.3px; display:inline-flex; align-items:center; gap:6px; border:1px solid #334155;">
                    <i class="fas fa-cloud" style="color:#3b82f6;"></i> supabase
                </span>
            </div>
        </div>
    </div>

    <!-- ===== STATISTIQUES RAPIDES ===== -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;">
        <div style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #c9a84c;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">Total commandes</p>
            <p style="font-size:1.8rem; font-weight:700; color:#1a1a1a;" id="totalCommandesStat">0</p>
        </div>
        <div style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #27ae60;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">✅ Soldées</p>
            <p style="font-size:1.8rem; font-weight:700; color:#27ae60;" id="totalSoldees">0</p>
        </div>
        <div style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #f39c12;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">⏳ En attente</p>
            <p style="font-size:1.8rem; font-weight:700; color:#f39c12;" id="totalEnAttente">0</p>
        </div>
        <div style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #e74c3c;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">❌ Annulées</p>
            <p style="font-size:1.8rem; font-weight:700; color:#e74c3c;" id="totalAnnulees">0</p>
        </div>
    </div>

    <!-- ===== BARRE DE RECHERCHE & FILTRES ===== -->
    <div style="display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:2rem; align-items:center; justify-content:space-between;">
        <div style="display:flex; flex-wrap:wrap; gap:0.75rem;">
            <input type="text" id="searchVentes" placeholder="🔍 Rechercher..." style="background:#ffffff; border:1px solid #d1d5db; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; outline:none; width:200px;">
            <select id="filterStatut" style="background:#ffffff; border:1px solid #d1d5db; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; outline:none; cursor:pointer;">
                <option value="all">📊 Tous</option>
                <option value="soldé">✅ Soldé</option>
                <option value="en attente">⏳ En attente</option>
                <option value="annulé">❌ Annulé</option>
            </select>
            <input type="date" id="dateDebut" style="background:#ffffff; border:1px solid #d1d5db; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; outline:none;">
            <input type="date" id="dateFin" style="background:#ffffff; border:1px solid #d1d5db; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; outline:none;">
            <button onclick="resetVentesFilters()" style="background:transparent; border:1px solid #cbd5e1; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; cursor:pointer;">
                <i class="fas fa-undo"></i> Réinitialiser
            </button>
        </div>
        <div style="display:flex; gap:0.75rem;">
            <button onclick="exportCSV()" style="background:#27ae60; border-color:#27ae60; color:white; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; cursor:pointer; border:none; box-shadow:0 4px 8px -2px rgba(39,174,96,0.25);">
                <i class="fas fa-file-export"></i> Exporter CSV
            </button>
            <button onclick="rafraichirVentes()" style="background:#3b82f6; border-color:#3b82f6; color:white; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; cursor:pointer; border:none; box-shadow:0 4px 8px -2px rgba(59,130,246,0.25);">
                <i class="fas fa-sync-alt"></i> Rafraîchir
            </button>
        </div>
    </div>

    <!-- ===== TABLEAU - COPIE EXACTE DU CATALOGUE PRODUITS ===== -->
    <div class="table-wrapper" id="tableWrapperVentes">
        <div class="table-scroll" id="tableScrollVentes">
            <table>
                <thead>
                    <tr>
                        <th class="col-id">#</th>
                        <th class="col-client">Client</th>
                        <th class="col-email">Email</th>
                        <th class="col-phone">Téléphone</th>
                        <th class="col-date">Date</th>
                        <th class="col-total">Total</th>
                        <th class="col-ville">Ville</th>
                        <th class="col-statut">Statut</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="ventesTableBody">
                    <tr>
                        <td colspan="9" style="text-align:center; padding:40px; color:#888;">
                            <i class="fas fa-spinner fa-spin" style="font-size:1.5rem; display:block; margin-bottom:12px;"></i>
                            Chargement des données...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="scroll-indicator">
            <i class="fas fa-chevron-left"></i>
            <span>Faites glisser ou scroll horizontalement</span>
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- ===== PAGINATION ===== -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:12px;">
        <span style="color:#888; font-size:0.9rem;" id="ventesPaginationInfo">Affichage de 0 à 0 sur 0 entrées</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button onclick="prevVentesPage()" id="prevVentesPage" style="background:transparent; border:1px solid #cbd5e1; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; cursor:pointer;">
                <i class="fas fa-chevron-left"></i> Précédent
            </button>
            <span id="ventesPageInfo" style="display:flex; align-items:center; padding:0 12px; font-weight:600; color:#1a1a1a;">Page 1</span>
            <button onclick="nextVentesPage()" id="nextVentesPage" style="background:transparent; border:1px solid #cbd5e1; padding:0.6rem 1.2rem; border-radius:30px; font-weight:500; font-size:0.95rem; color:#1e293b; cursor:pointer;">
                Suivant <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- ===== STYLES - IDENTIQUES AU CATALOGUE ===== -->
<style>
    * {
        box-sizing: border-box;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    /* ===== TABLEAU SCROLLABLE HORIZONTALEMENT ===== */
    .table-wrapper {
        position: relative;
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 20px -8px rgba(0,0,0,0.08);
        border: 1px solid #e9edf2;
        overflow: hidden;
        margin-top: 0.5rem;
    }
    
    .table-scroll {
        overflow-x: auto;
        overflow-y: visible;
        padding: 0.5rem 1rem 1rem 1rem;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }
    
    .table-scroll table {
        width: 100%;
        min-width: 1100px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 0.95rem;
    }
    
    .table-scroll thead th {
        position: sticky;
        top: 0;
        background: #f8fafc;
        color: #1e293b;
        font-weight: 600;
        padding: 1rem 0.8rem;
        text-align: left;
        border-bottom: 2px solid #e2e8f0;
        white-space: nowrap;
        z-index: 10;
    }
    
    .table-scroll thead th:first-child {
        border-radius: 12px 0 0 0;
        padding-left: 0.5rem;
    }
    
    .table-scroll thead th:last-child {
        border-radius: 0 12px 0 0;
    }
    
    .table-scroll tbody td {
        padding: 0.9rem 0.8rem;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
        white-space: nowrap;
    }
    
    .table-scroll tbody tr:hover {
        background: #f8fafc;
    }
    
    .table-scroll tbody tr:last-child td {
        border-bottom: none;
    }
    
    /* Colonnes spécifiques */
    .col-id {
        min-width: 50px;
        width: 50px;
        text-align: center;
        font-weight: 600;
    }
    .col-client {
        min-width: 140px;
        font-weight: 500;
    }
    .col-email {
        min-width: 200px;
        color: #475569;
    }
    .col-phone {
        min-width: 130px;
        color: #475569;
    }
    .col-date {
        min-width: 160px;
        color: #475569;
    }
    .col-total {
        min-width: 120px;
        font-weight: 600;
        color: #2563eb;
    }
    .col-ville {
        min-width: 100px;
        color: #475569;
    }
    .col-statut {
        min-width: 120px;
        text-align: center;
    }
    .col-actions {
        min-width: 200px;
        text-align: right;
    }
    
    .scroll-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.6rem 0 0.3rem;
        font-size: 0.8rem;
        color: #94a3b8;
        border-top: 1px solid #f1f5f9;
        margin: 0 1rem;
        user-select: none;
    }
    
    .scroll-indicator i {
        animation: pulseScroll 1.5s ease-in-out infinite;
    }
    
    @keyframes pulseScroll {
        0%, 100% { opacity: 0.4; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(6px); }
    }

    /* Badge statut */
    .statut-badge {
        padding: 3px 10px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
        color: white;
    }

    .action-btn {
        padding: 4px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.7rem;
        transition: all 0.2s;
        margin: 1px;
    }
    .action-btn:hover {
        transform: scale(1.1);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        #ventesContainer { padding: 16px; }
        .table-scroll { padding: 0.5rem 0.5rem 1rem 0.5rem; }
        .table-scroll table {
            min-width: 900px;
            font-size: 0.75rem;
        }
        .table-scroll table th,
        .table-scroll table td {
            padding: 8px 6px;
        }
        .table-scroll table th {
            font-size: 0.7rem;
        }
        .col-email { min-width: 150px; }
        .col-client { min-width: 120px; }
        .col-actions { min-width: 160px; }
    }

    @media (max-width: 480px) {
        #ventesContainer { padding: 12px; }
        .table-scroll table {
            min-width: 700px;
            font-size: 0.65rem;
        }
        .table-scroll table th,
        .table-scroll table td {
            padding: 5px 4px;
        }
        .col-email { min-width: 120px; }
        .col-client { min-width: 100px; }
        .col-actions { min-width: 140px; }
        .statut-badge { font-size: 0.5rem; padding: 1px 4px; }
        .action-btn { font-size: 0.5rem; padding: 2px 6px; }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        // ==========================================
        // SUPABASE CONFIG
        // ==========================================
        const SUPABASE_URL = "https://belekcdvgslnnejqonjb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_tb_mhTjs26f4hMQD0Y4SSQ_8JnF2dqp";
        
        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                window.supabaseClient = supabaseClient;
                console.log('✅ Supabase initialisé');
            } else {
                console.warn('⚠️ Supabase SDK non chargé');
            }
        } catch (e) {
            console.error('❌ Erreur initialisation Supabase:', e);
        }

        // ==========================================
        // VARIABLES
        // ==========================================
        let allVentes = [];
        let filteredVentes = [];
        let currentPage = 1;
        const perPage = 10;

        // ==========================================
        // DONNÉES DE TEST
        // ==========================================
        function getTestData() {
            return [
                { id: 14, prenom: 'Fridaos', nom: 'Kamara', email: 'saintmichel91647720@gmail.com', telephone: '81 64 34 66', ville: 'Maradi', pays: 'NE', created_at: new Date('2026-08-10T18:24:00').toISOString(), total_achat: null, statut_produit: 'en attente' },
                { id: 13, prenom: 'gagaga', nom: 'j\'çità', email: 'fzeihfihfzefi@gmail.com', telephone: '01 26 25 25 55', ville: 'Cotonou', pays: 'BJ', created_at: new Date('2026-08-09T11:31:00').toISOString(), total_achat: null, statut_produit: 'en attente' },
                { id: 12, prenom: 'Saint', nom: 'Michel', email: 'saintmichel91647720@gmail.com', telephone: '01 95 93 13 69', ville: 'Cotonou', pays: 'BJ', created_at: new Date('2026-07-16T08:58:00').toISOString(), total_achat: null, statut_produit: 'en attente' },
                { id: 11, prenom: 'izqezijozjqto', nom: 's(...)', email: 'xbbbbcnxc@gmail.com', telephone: '68 58 98 98 59', ville: 'Cotonou', pays: 'BJ', created_at: new Date('2026-07-06T23:46:00').toISOString(), total_achat: null, statut_produit: 'annulé' },
                { id: 10, prenom: 'gorge', nom: 'jeje', email: 'zlehze@gmail.com', telephone: '61 86 74 93 88', ville: 'Cotonou', pays: 'BJ', created_at: new Date('2026-07-06T23:30:00').toISOString(), total_achat: null, statut_produit: 'annulé' },
                { id: 7, prenom: 'jacob', nom: 'KOUAN', email: 'couhanjacob@gmail.com', telephone: '22 20 23 54 85', ville: 'Cotonou', pays: 'BJ', created_at: new Date('2026-07-06T20:35:00').toISOString(), total_achat: null, statut_produit: 'annulé' },
                { id: 1, prenom: 'Marie-Louise', nom: 'K...', email: 'mariekouassi@gmail.com', telephone: '65 65 95 85 89', ville: 'Abidjan', pays: 'CI', created_at: new Date('2026-07-04T23:44:00').toISOString(), total_achat: 5250.00, statut_produit: 'soldé' }
            ];
        }

        // ==========================================
        // FORMATER LA DATE
        // ==========================================
        function formatDate(dateString) {
            if (!dateString) return '—';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return '—';
            return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        // ==========================================
        // BADGE STATUT
        // ==========================================
        function getStatutBadge(statut) {
            const s = {
                'soldé': { bg: '#27ae60', icon: 'fa-check', text: 'Soldé' },
                'en attente': { bg: '#f39c12', icon: 'fa-clock', text: 'En attente' },
                'annulé': { bg: '#e74c3c', icon: 'fa-times', text: 'Annulé' }
            };
            const st = s[statut] || s['en attente'];
            return `<span class="statut-badge" style="background:${st.bg};">
                <i class="fas ${st.icon}"></i> ${st.text}
            </span>`;
        }

        // ==========================================
        // RENDU TABLEAU
        // ==========================================
        function renderVentes() {
            const tbody = document.getElementById('ventesTableBody');
            if (!tbody) return;
            
            if (filteredVentes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:#888;">
                    <i class="fas fa-inbox" style="font-size:2rem; display:block; margin-bottom:12px; color:#ddd;"></i>
                    Aucune vente trouvée.
                </td></tr>`;
                updateVentesPaginationInfo();
                return;
            }

            const start = (currentPage - 1) * perPage;
            const items = filteredVentes.slice(start, start + perPage);

            tbody.innerHTML = items.map(v => `
                <tr>
                    <td class="col-id">${v.id}</td>
                    <td class="col-client" title="${v.prenom || ''} ${v.nom || ''}">${v.prenom || ''} ${v.nom || ''}</td>
                    <td class="col-email" title="${v.email || '—'}">${v.email || '—'}</td>
                    <td class="col-phone">${v.telephone || '—'}</td>
                    <td class="col-date">${formatDate(v.created_at)}</td>
                    <td class="col-total">${v.total_achat ? v.total_achat.toFixed(2) + ' €' : '—'}</td>
                    <td class="col-ville" title="${v.ville || '—'}">${v.ville || '—'}</td>
                    <td class="col-statut">${getStatutBadge(v.statut)}</td>
                    <td class="col-actions">
                        <button class="action-btn" style="background:#27ae60; color:white;" onclick="updateStatut(${v.id}, 'soldé')">✅</button>
                        <button class="action-btn" style="background:#f39c12; color:white;" onclick="updateStatut(${v.id}, 'en attente')">⏳</button>
                        <button class="action-btn" style="background:#e74c3c; color:white;" onclick="updateStatut(${v.id}, 'annulé')">❌</button>
                    </td>
                </tr>
            `).join('');

            updateVentesPaginationInfo();
            updateScrollIndicator();
        }

        // ==========================================
        // INDICATEUR DE SCROLL
        // ==========================================
        function updateScrollIndicator() {
            const scrollEl = document.getElementById('tableScrollVentes');
            const indicator = document.querySelector('.scroll-indicator');
            if (scrollEl && indicator) {
                const maxScroll = scrollEl.scrollWidth - scrollEl.clientWidth;
                if (scrollEl.scrollLeft >= maxScroll - 5) {
                    indicator.style.opacity = '0.3';
                } else {
                    indicator.style.opacity = '1';
                }
            }
        }

        // ==========================================
        // STATISTIQUES
        // ==========================================
        function updateVentesStats() {
            const total = allVentes.length;
            const sold = allVentes.filter(v => v.statut === 'soldé').length;
            const attente = allVentes.filter(v => v.statut === 'en attente').length;
            const annul = allVentes.filter(v => v.statut === 'annulé').length;
            
            document.getElementById('totalCommandes').textContent = total;
            document.getElementById('totalCommandesStat').textContent = total;
            document.getElementById('totalSoldees').textContent = sold;
            document.getElementById('totalEnAttente').textContent = attente;
            document.getElementById('totalAnnulees').textContent = annul;
        }

        // ==========================================
        // PAGINATION
        // ==========================================
        function updateVentesPaginationInfo() {
            const total = filteredVentes.length;
            const start = (currentPage - 1) * perPage + 1;
            const end = Math.min(currentPage * perPage, total);
            const totalPages = Math.ceil(total / perPage) || 1;

            document.getElementById('ventesPaginationInfo').textContent = 
                `Affichage de ${total > 0 ? start : 0} à ${end} sur ${total} entrées`;
            document.getElementById('ventesPageInfo').textContent = `Page ${currentPage} sur ${totalPages}`;
            
            document.getElementById('prevVentesPage').disabled = currentPage <= 1;
            document.getElementById('nextVentesPage').disabled = currentPage >= totalPages;
        }

        function prevVentesPage() {
            if (currentPage > 1) { currentPage--; renderVentes(); }
        }

        function nextVentesPage() {
            const totalPages = Math.ceil(filteredVentes.length / perPage);
            if (currentPage < totalPages) { currentPage++; renderVentes(); }
        }

        // ==========================================
        // FILTRES
        // ==========================================
        function applyVentesFilters() {
            const search = document.getElementById('searchVentes').value.toLowerCase().trim();
            const statut = document.getElementById('filterStatut').value;
            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;

            filteredVentes = allVentes.filter(v => {
                let match = true;
                
                if (search) {
                    const fullName = `${v.prenom || ''} ${v.nom || ''}`.toLowerCase();
                    const email = (v.email || '').toLowerCase();
                    const phone = (v.telephone || '').toLowerCase();
                    match = fullName.includes(search) || email.includes(search) || phone.includes(search);
                }
                
                if (statut !== 'all') {
                    match = match && v.statut === statut;
                }
                
                if (dateDebut && match) {
                    const d1 = new Date(dateDebut);
                    const dV = new Date(v.created_at);
                    if (d1 > dV) match = false;
                }
                if (dateFin && match) {
                    const d2 = new Date(dateFin);
                    const dV = new Date(v.created_at);
                    d2.setHours(23, 59, 59);
                    if (d2 < dV) match = false;
                }
                
                return match;
            });

            currentPage = 1;
            renderVentes();
        }

        function resetVentesFilters() {
            document.getElementById('searchVentes').value = '';
            document.getElementById('filterStatut').value = 'all';
            document.getElementById('dateDebut').value = '';
            document.getElementById('dateFin').value = '';
            filteredVentes = [...allVentes];
            currentPage = 1;
            renderVentes();
        }

        // ==========================================
        // METTRE À JOUR LE STATUT
        // ==========================================
        async function updateStatut(id, newStatut) {
            const v = allVentes.find(item => item.id === id);
            if (!v) return;

            const oldStatut = v.statut;
            v.statut = newStatut;
            
            const f = filteredVentes.find(item => item.id === id);
            if (f) f.statut = newStatut;

            renderVentes();
            updateVentesStats();

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('clients')
                        .update({ statut_produit: newStatut })
                        .eq('id', id);

                    if (error) {
                        console.error('❌ Erreur mise à jour Supabase:', error);
                        v.statut = oldStatut;
                        if (f) f.statut = oldStatut;
                        renderVentes();
                        updateVentesStats();
                        showNotification('❌ Erreur lors de la mise à jour', 'error');
                        return;
                    }
                }
                
                showNotification(`✅ Statut mis à jour : ${newStatut}`, 'success');

            } catch (err) {
                console.error('❌ Erreur:', err);
                showNotification('❌ Erreur lors de la mise à jour', 'error');
            }
        }

        // ==========================================
        // EXPORTER CSV
        // ==========================================
        function exportCSV() {
            if (allVentes.length === 0) {
                showNotification('❌ Aucune donnée à exporter', 'error');
                return;
            }

            let csv = 'ID,Client,Email,Téléphone,Date,Total,Ville,Pays,Statut\n';
            allVentes.forEach(v => {
                const client = `${v.prenom || ''} ${v.nom || ''}`.trim();
                const statutValue = v.statut_produit || v.statut || '';
                csv += `${v.id},"${client}","${v.email || ''}","${v.telephone || ''}","${formatDate(v.created_at)}","${v.total_achat || 0}","${v.ville || ''}","${v.pays || ''}","${statutValue}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ventes_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showNotification('✅ Export CSV effectué avec succès', 'success');
        }

        // ==========================================
        // RAFRAÎCHIR
        // ==========================================
        function rafraichirVentes() {
            loadVentesData();
            showNotification('🔄 Données actualisées', 'info');
        }

        // ==========================================
        // CHARGER LES DONNÉES
        // ==========================================
        async function loadVentesData() {
            try {
                console.log('📝 Chargement des données...');
                
                if (!supabaseClient) {
                    console.warn('⚠️ Supabase non disponible, utilisation des données de test');
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('clients')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('❌ Erreur chargement:', error);
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                    return;
                }

                if (data && data.length > 0) {
                    console.log(`✅ ${data.length} clients chargés`);
                    
                    allVentes = data.map(c => ({
                        ...c,
                        statut: c.statut_produit || 'en attente'
                    }));
                    
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                } else {
                    console.warn('⚠️ Aucune donnée, utilisation des données de test');
                    allVentes = getTestData();
                    filteredVentes = [...allVentes];
                    renderVentes();
                    updateVentesStats();
                }

            } catch (err) {
                console.error('❌ Erreur:', err);
                allVentes = getTestData();
                filteredVentes = [...allVentes];
                renderVentes();
                updateVentesStats();
            }
        }

        // ==========================================
        // NOTIFICATION
        // ==========================================
        function showNotification(message, type = 'info') {
            document.querySelectorAll('.toast-nikel').forEach(t => t.remove());

            const colors = {
                success: '#27ae60',
                error: '#e74c3c',
                info: '#3b82f6'
            };

            const toast = document.createElement('div');
            toast.className = 'toast-nikel';
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 1rem 1.5rem;
                border-radius: 12px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 8px 24px rgba(0,0,0,0.15);
                max-width: 400px;
                background: ${colors[type] || colors.info};
            `;
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ==========================================
        // EXPOSER LES FONCTIONS
        // ==========================================
        window.applyVentesFilters = applyVentesFilters;
        window.resetVentesFilters = resetVentesFilters;
        window.prevVentesPage = prevVentesPage;
        window.nextVentesPage = nextVentesPage;
        window.updateStatut = updateStatut;
        window.exportCSV = exportCSV;
        window.rafraichirVentes = rafraichirVentes;
        window.showNotification = showNotification;
        window.loadVentesData = loadVentesData;

        // ==========================================
        // INITIALISATION
        // ==========================================
        function init() {
            console.log('🚀 Chargement de suivi-ventes.html...');
            
            const tbody = document.getElementById('ventesTableBody');
            if (!tbody) {
                console.error('❌ Table body non trouvé');
                return;
            }
            
            loadVentesData();

            // Détection du scroll
            const scrollEl = document.getElementById('tableScrollVentes');
            if (scrollEl) {
                scrollEl.addEventListener('scroll', function() {
                    const indicator = document.querySelector('.scroll-indicator');
                    if (indicator) {
                        const maxScroll = this.scrollWidth - this.clientWidth;
                        if (this.scrollLeft >= maxScroll - 5) {
                            indicator.style.opacity = '0.3';
                        } else {
                            indicator.style.opacity = '1';
                        }
                    }
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
