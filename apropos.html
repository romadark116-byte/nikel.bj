<style>
    /* ==========================================
       STYLES DE BASE - À PROPOS
       ========================================== */

    /* Section Fondateur */
    .founder-section {
        background: var(--white);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 40px;
        margin-top: 30px;
    }

    .founder-grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 40px;
        align-items: start;
    }

    .founder-photo {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        aspect-ratio: 1/1;
        background: var(--off-white);
    }

    .founder-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
    }

    .founder-photo:hover img {
        transform: scale(1.03);
    }

    .founder-photo .social-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px;
        background: linear-gradient(transparent, rgba(0,0,0,0.6));
        display: flex;
        justify-content: center;
        gap: 16px;
    }

    .founder-photo .social-overlay a {
        color: white;
        font-size: 1.2rem;
        transition: all 0.3s;
        opacity: 0.8;
    }

    .founder-photo .social-overlay a:hover {
        opacity: 1;
        transform: translateY(-3px);
    }

    .founder-info h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.8rem;
        margin-bottom: 4px;
        color: var(--dark-gray);
    }

    .founder-info .title {
        color: var(--gold);
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 16px;
        display: block;
    }

    .founder-info .bio {
        color: var(--gray);
        line-height: 1.8;
        margin-bottom: 16px;
    }

    .founder-info .bio:last-of-type {
        margin-bottom: 20px;
    }

    .founder-info .signature {
        font-family: 'Playfair Display', serif;
        font-size: 1.4rem;
        color: var(--gold);
        font-style: italic;
    }

    /* Indicateur de chargement */
    .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        color: var(--gray);
    }

    .loading-spinner i {
        font-size: 2rem;
        animation: spin 1s linear infinite;
        margin-right: 12px;
        color: var(--gold);
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* ==========================================
       GALERIE D'IMAGES
       ========================================== */
    .gallery-container {
        position: relative;
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        background: var(--off-white);
        aspect-ratio: 16/10;
    }

    .gallery-slide {
        display: none;
        width: 100%;
        height: 100%;
    }

    .gallery-slide.active {
        display: block;
        animation: fadeIn 0.8s ease;
    }

    .gallery-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .gallery-slide .slide-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 30px 20px 20px;
        background: linear-gradient(transparent, rgba(0,0,0,0.7));
        color: white;
        text-align: center;
    }

    .gallery-slide .slide-caption h4 {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        margin-bottom: 4px;
    }

    .gallery-slide .slide-caption p {
        font-size: 0.9rem;
        opacity: 0.9;
        margin: 0;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(1.02); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Boutons de navigation */
    .gallery-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        backdrop-filter: blur(4px);
    }

    .gallery-btn:hover {
        background: var(--gold);
        transform: translateY(-50%) scale(1.1);
    }

    .gallery-btn.prev {
        left: 16px;
    }

    .gallery-btn.next {
        right: 16px;
    }

    /* Indicateurs (dots) */
    .gallery-dots {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
    }

    .gallery-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        border: 2px solid rgba(255,255,255,0.3);
        cursor: pointer;
        transition: all 0.3s;
    }

    .gallery-dot.active {
        background: var(--gold);
        border-color: var(--gold);
        transform: scale(1.2);
    }

    .gallery-dot:hover {
        background: rgba(255,255,255,0.8);
    }

    /* Conteneur principal de la section about */
    .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
        align-items: start;
    }

    .about-text {
        padding-right: 20px;
    }

    .about-image {
        width: 100%;
    }

    /* Message si aucune image */
    .gallery-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 300px;
        color: var(--gray);
        text-align: center;
        padding: 40px;
    }

    .gallery-empty i {
        font-size: 3rem;
        margin-bottom: 15px;
        color: var(--light-gray);
    }

    /* Valeurs */
    .values-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
        margin-top: 10px;
    }

    .value-card {
        background: var(--white);
        padding: 30px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        text-align: center;
        transition: transform 0.3s;
    }

    .value-card:hover {
        transform: translateY(-5px);
    }

    .value-card i {
        font-size: 2.5rem;
        color: var(--gold);
        margin-bottom: 16px;
    }

    .value-card h4 {
        font-size: 1.1rem;
        margin-bottom: 8px;
    }

    .value-card p {
        color: var(--gray);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
    }

    /* Statistiques */
    .about-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 30px;
        padding: 20px;
        background: var(--off-white);
        border-radius: 12px;
    }

    .about-stats div {
        text-align: center;
    }

    .about-stats strong {
        display: block;
        font-size: 1.8rem;
        color: var(--gold);
        font-weight: 700;
    }

    .about-stats span {
        font-size: 0.85rem;
        color: var(--gray);
    }

    /* ========================================== */
    /* RESPONSIVE - À PROPOS                      */
    /* ========================================== */

    /* Tablettes et petits écrans */
    @media (max-width: 1024px) {
        .values-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .founder-grid {
            grid-template-columns: 220px 1fr;
            gap: 30px;
        }
    }

    /* Mobiles (max-width: 768px) */
    @media (max-width: 768px) {
        .about-grid {
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .about-text {
            padding-right: 0;
        }

        .gallery-container {
            aspect-ratio: 16/9;
        }

        .founder-grid {
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .founder-photo {
            max-width: 280px;
            margin: 0 auto;
        }

        .founder-section {
            padding: 24px;
            margin-top: 20px;
        }

        .founder-info h3 {
            font-size: 1.5rem;
            text-align: center;
        }

        .founder-info .title {
            text-align: center;
        }

        .founder-info .bio {
            font-size: 0.95rem;
        }

        .founder-info .signature {
            text-align: center;
            font-size: 1.2rem;
        }

        .gallery-btn {
            width: 36px;
            height: 36px;
            font-size: 0.9rem;
        }

        .gallery-btn.prev {
            left: 8px;
        }

        .gallery-btn.next {
            right: 8px;
        }

        .gallery-dots {
            gap: 8px;
            bottom: 12px;
        }

        .gallery-dot {
            width: 8px;
            height: 8px;
        }

        .gallery-slide .slide-caption h4 {
            font-size: 1rem;
        }

        .gallery-slide .slide-caption p {
            font-size: 0.8rem;
        }

        .values-grid {
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .value-card {
            padding: 20px;
        }

        .value-card i {
            font-size: 2rem;
        }

        .value-card h4 {
            font-size: 1rem;
        }

        .value-card p {
            font-size: 0.85rem;
        }

        .about-stats {
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .about-stats strong {
            font-size: 1.4rem;
        }

        .about-stats span {
            font-size: 0.75rem;
        }
    }

    /* Très petits mobiles (max-width: 480px) */
    @media (max-width: 480px) {
        .founder-section {
            padding: 16px;
            margin-top: 16px;
        }

        .founder-photo {
            max-width: 200px;
        }

        .founder-photo .social-overlay {
            padding: 12px;
            gap: 12px;
        }

        .founder-photo .social-overlay a {
            font-size: 1rem;
        }

        .founder-info h3 {
            font-size: 1.3rem;
        }

        .founder-info .title {
            font-size: 0.85rem;
        }

        .founder-info .bio {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .founder-info .signature {
            font-size: 1rem;
        }

        .gallery-container {
            aspect-ratio: 4/3;
        }

        .gallery-btn {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
        }

        .gallery-slide .slide-caption {
            padding: 20px 16px 14px;
        }

        .gallery-slide .slide-caption h4 {
            font-size: 0.9rem;
        }

        .gallery-slide .slide-caption p {
            font-size: 0.75rem;
        }

        .gallery-dots {
            gap: 6px;
            bottom: 10px;
        }

        .gallery-dot {
            width: 6px;
            height: 6px;
        }

        .values-grid {
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .value-card {
            padding: 16px;
        }

        .value-card i {
            font-size: 1.8rem;
        }

        .value-card h4 {
            font-size: 0.95rem;
        }

        .value-card p {
            font-size: 0.85rem;
        }

        .about-stats {
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 14px;
        }

        .about-stats strong {
            font-size: 1.2rem;
        }

        .about-stats span {
            font-size: 0.8rem;
        }

        .section-title {
            font-size: 1.5rem;
        }
    }

    /* Très petit mobile (max-width: 360px) */
    @media (max-width: 360px) {
        .founder-photo {
            max-width: 160px;
        }

        .founder-info h3 {
            font-size: 1.1rem;
        }

        .founder-info .bio {
            font-size: 0.85rem;
        }

        .gallery-btn {
            width: 28px;
            height: 28px;
            font-size: 0.7rem;
        }

        .gallery-btn.prev {
            left: 4px;
        }

        .gallery-btn.next {
            right: 4px;
        }

        .value-card {
            padding: 14px;
        }

        .value-card i {
            font-size: 1.5rem;
        }

        .value-card h4 {
            font-size: 0.85rem;
        }

        .value-card p {
            font-size: 0.8rem;
        }
    }

    /* Orientation paysage sur mobile */
    @media (max-width: 768px) and (orientation: landscape) {
        .founder-grid {
            grid-template-columns: 180px 1fr;
            gap: 20px;
        }

        .founder-photo {
            max-width: 180px;
        }

        .gallery-container {
            aspect-ratio: 16/8;
        }

        .values-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
