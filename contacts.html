<!-- contacts.html - Mes contacts (tableau supprimé, zone vide) -->
<div id="contactsContainer" style="background:#ffffff; border-radius:16px; box-shadow:0 2px 20px rgba(0,0,0,0.08); padding:32px;">

    <!-- ===== TITRE ===== -->
    <div class="contacts-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:24px; gap:12px;">
        <div>
            <h2 style="font-family:'Playfair Display',serif; font-size:1.6rem; color:#1a1a1a; margin-bottom:4px;">
                <i class="fas fa-address-book" style="color:#c9a84c;"></i> Mes contacts
            </h2>
            <p style="color:#888; font-size:0.95rem;">Gérez votre liste de clients et prospects.</p>
        </div>
        <button onclick="openAddModal()" class="btn-add" style="padding:12px 24px; background:linear-gradient(135deg, #c9a84c, #a8892e); color:white; border:none; border-radius:10px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.3s; display:flex; align-items:center; gap:8px; white-space:nowrap;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                <i class="fas fa-plus"></i> Ajouter un contact
            </button>
    </div>

    <!-- ===== STATISTIQUES ===== -->
    <div class="contacts-stats" style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;">
        <div class="stat-card" style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #c9a84c;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">Total contacts</p>
            <p style="font-size:1.8rem; font-weight:700; color:#1a1a1a;" id="totalContacts">0</p>
        </div>
        <div class="stat-card" style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #27ae60;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">✅ Clients</p>
            <p style="font-size:1.8rem; font-weight:700; color:#27ae60;" id="totalClients">0</p>
        </div>
        <div class="stat-card" style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #f39c12;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">⭐ Prospects</p>
            <p style="font-size:1.8rem; font-weight:700; color:#f39c12;" id="totalProspects">0</p>
        </div>
        <div class="stat-card" style="background:#f8f8f8; padding:16px; border-radius:12px; text-align:center; border-left:4px solid #3498db;">
            <p style="font-size:0.8rem; color:#888; margin-bottom:4px;">👤 Actifs</p>
            <p style="font-size:1.8rem; font-weight:700; color:#3498db;" id="totalActifs">0</p>
        </div>
    </div>

    <!-- ===== FILTRES ===== -->
    <div class="contacts-filters" style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; align-items:center; background:#f8f8f8; padding:16px; border-radius:12px;">
        <div style="flex:2; min-width:180px;">
            <input type="text" id="searchInputContacts" placeholder="🔍 Rechercher..." style="width:100%; padding:10px 14px; border:2px solid #e8e8e8; border-radius:10px; font-size:0.95rem; background:#ffffff; outline:none; transition:border-color 0.3s; box-sizing:border-box;" onfocus="this.style.borderColor='#c9a84c'" onblur="this.style.borderColor='#e8e8e8'" onkeyup="applyFilters()">
        </div>
        <div style="min-width:130px; flex:1;">
            <select id="filterType" style="width:100%; padding:10px 14px; border:2px solid #e8e8e8; border-radius:10px; font-size:0.95rem; background:#ffffff; cursor:pointer; outline:none; transition:border-color 0.3s; box-sizing:border-box;" onfocus="this.style.borderColor='#c9a84c'" onblur="this.style.borderColor='#e8e8e8'" onchange="applyFilters()">
                <option value="all">👥 Tous</option>
                <option value="client">✅ Clients</option>
                <option value="prospect">⭐ Prospects</option>
            </select>
        </div>
        <button onclick="resetFilters()" style="padding:10px 20px; background:transparent; border:2px solid #e8e8e8; border-radius:10px; font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.3s; color:#888; white-space:nowrap;" onmouseover="this.style.borderColor='#c9a84c';this.style.color='#c9a84c'" onmouseout="this.style.borderColor='#e8e8e8';this.style.color='#888'">
            <i class="fas fa-undo"></i> Réinitialiser
        </button>
    </div>

    <!-- ===== ZONE VIDE - TABLEAU SUPPRIMÉ ===== -->
    <!-- Le tableau a été retiré -->

    <!-- ===== PAGINATION ===== -->
    <div class="contacts-pagination" style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:12px;">
        <span style="color:#888; font-size:0.9rem;" id="paginationInfo">Affichage de 0 à 0 sur 0</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button onclick="previousPage()" id="prevPage" style="padding:8px 16px; border:2px solid #e8e8e8; border-radius:8px; background:transparent; cursor:pointer; transition:all 0.3s; color:#888;" onmouseover="this.style.borderColor='#c9a84c';this.style.color='#c9a84c'" onmouseout="this.style.borderColor='#e8e8e8';this.style.color='#888'">
                <i class="fas fa-chevron-left"></i> Précédent
            </button>
            <span id="pageInfo" style="display:flex; align-items:center; padding:0 12px; font-weight:600; color:#1a1a1a;">Page 1</span>
            <button onclick="nextPage()" id="nextPage" style="padding:8px 16px; border:2px solid #e8e8e8; border-radius:8px; background:transparent; cursor:pointer; transition:all 0.3s; color:#888;" onmouseover="this.style.borderColor='#c9a84c';this.style.color='#c9a84c'" onmouseout="this.style.borderColor='#e8e8e8';this.style.color='#888'">
                Suivant <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<!-- ===== MODAL (inchangée) ===== -->
<div id="contactModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; padding:16px;">

                        <option value="Ouagadougou">Ouagadougou</option>
                        <option value="Bobo-Dioulasso">Bobo-Dioulasso</option>
                        <option value="Koudougou">Koudougou</option>
                        <option value="Banfora">Banfora</option>
                        <option value="Ouahigouya">Ouahigouya</option>

                        <option value="Yamoussoukro">Yamoussoukro</option>
                        <option value="Bouaké">Bouaké</option>
                        <option value="San-Pédro">San-Pédro</option>
                        <option value="Korhogo">Korhogo</option>
                    </select>
                </div>
                <div style="margin-bottom:12px;">
                    <label for="pays" style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px; color:#1a1a1a;">Pays</label>
                    <input type="text" id="paysDisplay" value="Bénin" readonly style="width:100%; padding:10px 14px; border:2px solid #e8e8e8; border-radius:10px; font-size:0.95rem; background:#f0f0f0; color:#666; cursor:not-allowed; box-sizing:border-box;">
                    <input type="hidden" id="pays" value="BJ">

            <div style="margin-bottom:12px;">

                <select id="statut_contact" style="width:100%; padding:10px 14px; border:2px solid #e8e8e8; border-radius:10px; font-size:0.95rem; background:#f8f8f8; box-sizing:border-box;">

            const config = phoneConfig[indicatif];
            const phoneInput = document.getElementById('telephone');
            const phoneHelp = document.getElementById('phoneHelp');
            if (config && phoneInput) {
                phoneInput.placeholder = config.placeholder;
                if (phoneHelp) phoneHelp.textContent = config.help;
                phoneInput.value = '';
            }
        }

        function validatePhone(input) {
            let value = input.value.replace(/\D/g, '');
            const indicatif = document.getElementById('indicatif').value;
            const config = phoneConfig[indicatif];
            if (!config) return;
            if (value.length > config.nbDigits) value = value.slice(0, config.nbDigits);
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 2 === 0) formatted += ' ';
                formatted += value[i];
            }
            input.value = formatted;
        }

        function updateVilles() {
            const paysCode = document.getElementById('pays').value;
            const villes = villesParPays[paysCode] || ['Cotonou', 'Porto-Novo', 'Parakou', 'Abomey-Calavi', 'Djougou'];
            const villeSelect = document.getElementById('ville');
            villeSelect.innerHTML = villes.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function getStatutBadge(statut) {
            if (statut === 'client') {
                return `<span style="background:#27ae60; color:white; padding:3px 10px; border-radius:50px; font-size:0.7rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;">
                    <i class="fas fa-check"></i> Client
                </span>`;
            } else {
                return `<span style="background:#f39c12; color:white; padding:3px 10px; border-radius:50px; font-size:0.7rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;">
                    <i class="fas fa-star"></i> Prospect
                </span>`;
            }
        }

        // ==========================================
        // CHARGER LES DONNÉES
        // ==========================================
        async function loadContactsData() {
            try {
                console.log('📝 Chargement des contacts...');
                
                const { data, error } = await supabaseClient
                    .from('clients')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                allContacts = data ? data.map(c => ({ ...c, statut: c.statut_contact || 'prospect' })) : [];
                filteredContacts = [...allContacts];
                renderContacts();
                updateStats();
                updatePaginationInfo();

            } catch (err) {
                console.error('❌ Erreur:', err);
                allContacts = [];
                filteredContacts = [];
                renderContacts();
                updateStats();
                updatePaginationInfo();
            }
        }

        // ==========================================
        // RENDU - VIDEO (tableau supprimé)
        // ==========================================
        function renderContacts() {
            // Le tableau a été supprimé, cette fonction ne fait plus rien
            console.log('📋 Tableau supprimé, aucun rendu');
        }

        // ==========================================
        // STATISTIQUES
        // ==========================================
        function updateStats() {
            const total = allContacts.length;
            const clients = allContacts.filter(c => c.statut === 'client').length;
            const prospects = allContacts.filter(c => c.statut === 'prospect').length;
            const actifs = allContacts.filter(c => c.statut === 'client' && c.email).length;
            
            document.getElementById('totalContacts').textContent = total;
            document.getElementById('totalClients').textContent = clients;
            document.getElementById('totalProspects').textContent = prospects;
            document.getElementById('totalActifs').textContent = actifs;
        }

        // ==========================================
        // PAGINATION
        // ==========================================
        function updatePaginationInfo() {
            const total = filteredContacts.length;
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, total);
            const totalPages = Math.ceil(total / itemsPerPage) || 1;

            document.getElementById('paginationInfo').textContent = 
                `Affichage de ${total > 0 ? start : 0} à ${end} sur ${total} entrées`;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} sur ${totalPages}`;

            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePaginationInfo();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredContacts.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                updatePaginationInfo();
            }
        }

        // ==========================================
        // FILTRES
        // ==========================================
        function applyFilters() {
            const searchTerm = document.getElementById('searchInputContacts').value.toLowerCase().trim();
            const typeFilter = document.getElementById('filterType').value;

            filteredContacts = allContacts.filter(contact => {
                let matchSearch = true;
                if (searchTerm) {
                    const fullName = (contact.prenom + ' ' + contact.nom).toLowerCase();
                    const email = (contact.email || '').toLowerCase();
                    const telephone = (contact.telephone || '').toLowerCase();
                    matchSearch = fullName.includes(searchTerm) || email.includes(searchTerm) || telephone.includes(searchTerm);
                }

                let matchType = true;
                if (typeFilter !== 'all') {
                    matchType = contact.statut === typeFilter;
                }

                return matchSearch && matchType;
            });

            currentPage = 1;
            updatePaginationInfo();
        }

        function resetFilters() {
            document.getElementById('searchInputContacts').value = '';
            document.getElementById('filterType').value = 'all';
            filteredContacts = [...allContacts];
            currentPage = 1;
            updatePaginationInfo();
        }

        // ==========================================
        // MODAL
        // ==========================================
        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus" style="color:#c9a84c;"></i> Ajouter un contact';
            document.getElementById('contactId').value = '';
            document.getElementById('contactForm').reset();
            document.getElementById('statut_contact').value = 'prospect';
            document.getElementById('indicatif').value = '+229';
            document.getElementById('pays').value = 'BJ';
            document.getElementById('paysDisplay').value = 'Bénin';
            document.getElementById('contactModal').style.display = 'flex';
            updateVilles();
            updatePhonePlaceholder();
        }

        function editContact(id) {
            const contact = allContacts.find(c => c.id === id);
            if (!contact) {
                showNotification('❌ Contact non trouvé', 'error');
                return;
            }

            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-edit" style="color:#c9a84c;"></i> Modifier le contact';
            document.getElementById('contactId').value = contact.id;
            
            document.getElementById('prenom').value = contact.prenom || '';
            document.getElementById('nom').value = contact.nom || '';
            document.getElementById('email').value = contact.email || '';
            
            const indicatif = contact.indicatif || '+229';
            document.getElementById('indicatif').value = indicatif;
            document.getElementById('telephone').value = contact.telephone || '';
            
            document.getElementById('ville').value = contact.ville || 'Cotonou';
            document.getElementById('pays').value = contact.pays || 'BJ';
            document.getElementById('paysDisplay').value = paysLabels[contact.pays] || 'Bénin';
            
            document.getElementById('statut_contact').value = contact.statut || 'prospect';
            
            document.getElementById('contactModal').style.display = 'flex';
            updateVilles();
            updatePhonePlaceholder();
        }

        function closeModal() {
            document.getElementById('contactModal').style.display = 'none';
            document.getElementById('contactForm').reset();
        }

        // ==========================================
        // SAUVEGARDER
        // ==========================================
        async function saveContact(event) {
            event.preventDefault();

            const id = document.getElementById('contactId').value;
            const indicatif = document.getElementById('indicatif').value;
            const telephone = document.getElementById('telephone').value.trim();
            const paysCode = document.getElementById('pays').value;
            
            const contactData = {
                prenom: document.getElementById('prenom').value.trim(),
                nom: document.getElementById('nom').value.trim(),
                email: document.getElementById('email').value.trim(),
                telephone: telephone,
                indicatif: indicatif,
                ville: document.getElementById('ville').value,
                pays: paysCode,
                statut_contact: document.getElementById('statut_contact').value,
                date_clic: new Date().toISOString()
            };

            try {
                const saveBtn = document.getElementById('saveContactBtn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

                if (id) {
                    const { error } = await supabaseClient
                        .from('clients')
                        .update(contactData)
                        .eq('id', parseInt(id));

                    if (error) throw error;

                    const index = allContacts.findIndex(c => c.id === parseInt(id));
                    if (index !== -1) {
                        allContacts[index] = { ...allContacts[index], ...contactData, statut: contactData.statut_contact };
                    }
                    showNotification('✅ Contact modifié !', 'success');
                } else {
                    const { data, error } = await supabaseClient
                        .from('clients')
                        .insert([contactData])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        allContacts.push({ ...data[0], statut: data[0].statut_contact || 'prospect' });
                    }
                    showNotification('✅ Contact ajouté !', 'success');
                }

                closeModal();
                filteredContacts = [...allContacts];
                updateStats();
                updatePaginationInfo();

            } catch (err) {
                console.error('❌ Erreur:', err);
                showNotification('❌ Erreur: ' + err.message, 'error');
            } finally {
                const saveBtn = document.getElementById('saveContactBtn');
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
            }
        }

        // ==========================================
        // SUPPRIMER
        // ==========================================
        async function deleteContact(id) {
            if (!confirm('Supprimer ce contact ?')) return;

            try {
                const { error } = await supabaseClient
                    .from('clients')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                allContacts = allContacts.filter(c => c.id !== id);
                filteredContacts = [...allContacts];
                updateStats();
                updatePaginationInfo();
                showNotification('🗑️ Contact supprimé', 'info');

            } catch (err) {
                console.error('❌ Erreur:', err);
                showNotification('❌ Erreur: ' + err.message, 'error');
            }
        }

        // ==========================================
        // NOTIFICATION
        // ==========================================
        function showNotification(message, type = 'info') {
            document.querySelectorAll('.toast-nati').forEach(t => t.remove());
            
            const colors = {
                success: '#27ae60',
                error: '#e74c3c',
                info: '#c9a84c'
            };

            const toast = document.createElement('div');
            toast.className = 'toast-nati';
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: #1a1a1a;
                color: white;
                padding: 16px 24px;
                border-radius: 14px;
                font-weight: 500;
                box-shadow: 0 8px 40px rgba(0,0,0,0.25);
                z-index: 9999;
                max-width: 400px;
                font-size: 0.95rem;
                display: flex;
                align-items: center;
                gap: 12px;
                animation: slideUp 0.5s ease;
                border-left: 4px solid ${colors[type] || colors.info};
            `;
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // ==========================================
        // EXPOSER LES FONCTIONS
        // ==========================================
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;
        window.previousPage = previousPage;
        window.nextPage = nextPage;
        window.openAddModal = openAddModal;
        window.editContact = editContact;
        window.deleteContact = deleteContact;
        window.closeModal = closeModal;
        window.saveContact = saveContact;
        window.showNotification = showNotification;
        window.updatePaysFromIndicatif = updatePaysFromIndicatif;
        window.updateVilles = updateVilles;
        window.updatePhonePlaceholder = updatePhonePlaceholder;
        window.validatePhone = validatePhone;

        // ==========================================
        // INIT
        // ==========================================
        function init() {
            console.log('🚀 Chargement de contacts.html (tableau supprimé)...');
            loadContactsData();

            document.getElementById('contactForm').addEventListener('submit', saveContact);

            document.getElementById('contactModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
